async function finnhub(endpoint) {
  const key = getKey('finnhub');
  if (!key) { console.error('NO KEY'); return null; }
  try {
    // Use Cloudflare Pages Function proxy to avoid CORS
    const url = `/fh?endpoint=${encodeURIComponent(endpoint)}&token=${key}`;
    const r = await fetch(url);
    if (!r.ok) {
      console.warn('Proxy error', r.status, endpoint);
      return null;
    }
    const d = await r.json();
    return d;
  } catch(e) {
    console.error('Proxy fetch error:', e.message, endpoint);
    return null;
  }
}

// ── Signal Scorers ────────────────────────────────────────────────────────────
function scoreReversal(candles) {
  // Checks if price is near 52-week low AND has bounced on high volume
  if (!candles || !candles.c || candles.c.length < 20) return {score:0, detail:'No data'};
  const closes = candles.c;
  const volumes = candles.v || [];
  const low52 = Math.min(...closes);
  const high52 = Math.max(...closes);
  const current = closes[closes.length-1];
  const range = high52 - low52;
  const posInRange = range > 0 ? (current - low52) / range : 0.5;
  // Near 52-week low = bottom 25%
  const nearLow = posInRange < 0.25;
  // Recent volume spike = last 5 days avg vs 20-day avg
  const recentVol = volumes.slice(-5).reduce((s,v)=>s+v,0)/5;
  const avgVol = volumes.slice(-20).reduce((s,v)=>s+v,0)/20;
  const volSpike = avgVol > 0 ? recentVol/avgVol : 1;
  // Price bouncing = last 5 days up
  const recentClose = closes.slice(-5);
  const bouncing = recentClose[recentClose.length-1] > recentClose[0];
  let score = 0;
  const signals = [];
  if (nearLow) { score += 50; signals.push('Near 52wk low'); }
  if (volSpike > 1.5) { score += 30; signals.push(`Volume ${volSpike.toFixed(1)}x avg`); }
  if (bouncing && nearLow) { score += 20; signals.push('Bouncing from low'); }
  return {
    score: Math.min(100, score),
    detail: signals.join(' + ') || 'No reversal pattern',
    posInRange: (posInRange*100).toFixed(0),
    low52: low52.toFixed(2),
    high52: high52.toFixed(2),
    current: current.toFixed(2),
  };
}

function scoreInsider(data) {
  // Count recent buys vs sells in last 90 days
  if (!data || !data.data) return {score:0, detail:'No data', buyers:0};
  const cutoff = Date.now() - 90*86400000;
  const recent = data.data.filter(t => new Date(t.transactionDate).getTime() > cutoff);
  const buys = recent.filter(t => t.change > 0);
  const sells = recent.filter(t => t.change < 0);
  const buyers = [...new Set(buys.map(t => t.name))].length;
  const totalBuyValue = buys.reduce((s,t) => s + Math.abs(t.transactionPrice * t.change), 0);
  let score = 0;
  const signals = [];
  if (buyers >= 3) { score += 60; signals.push(`${buyers} insiders buying`); }
  else if (buyers >= 2) { score += 35; signals.push(`${buyers} insiders buying`); }
  else if (buyers >= 1) { score += 15; signals.push(`${buyers} insider buying`); }
  if (sells.length === 0 && buyers > 0) { score += 20; signals.push('No insider selling'); }
  if (totalBuyValue > 1000000) { score += 20; signals.push(`$${(totalBuyValue/1000000).toFixed(1)}M bought`); }
  return {
    score: Math.min(100, score),
    detail: signals.join(' + ') || 'No insider activity',
    buyers, sells: sells.length,
    totalBuyValue: totalBuyValue.toFixed(0),
  };
}

function scoreAnalyst(recs) {
  // Strong Buy consensus + recent upgrades
  if (!recs || !recs.length) return {score:0, detail:'No data'};
  const latest = recs[0];
  if (!latest) return {score:0, detail:'No data'};
  const { strongBuy=0, buy=0, hold=0, sell=0, strongSell=0 } = latest;
  const total = strongBuy+buy+hold+sell+strongSell;
  if (total === 0) return {score:0, detail:'No coverage'};
  const bullPct = (strongBuy+buy)/total;
  let score = 0;
  const signals = [];
  if (bullPct > 0.75) { score += 60; signals.push(`${Math.round(bullPct*100)}% Buy/Strong Buy`); }
  else if (bullPct > 0.5) { score += 35; signals.push(`${Math.round(bullPct*100)}% Buy/Strong Buy`); }
  // Check for recent trend (last 2 periods)
  if (recs.length >= 2) {
    const prev = recs[1];
    const prevBull = (prev.strongBuy+prev.buy)/(prev.strongBuy+prev.buy+prev.hold+prev.sell+prev.strongSell);
    if (bullPct > prevBull + 0.05) { score += 25; signals.push('Analyst upgrades trend'); }
    if (latest.strongBuy > prev.strongBuy) { score += 15; signals.push(`Strong Buy count rising`); }
  }
  return {
    score: Math.min(100, score),
    detail: signals.join(' + ') || `${Math.round(bullPct*100)}% bullish`,
    strongBuy, buy, hold, sell, strongSell, total,
  };
}

// ── Main Scan ─────────────────────────────────────────────────────────────────
async function runScan() {
  if (scanning) return;
  const key = getKey('finnhub');
  if (!key) { toast('Enter your Finnhub API key first'); return; }

  scanning = true;
  results = [];
  renderScanner();

  const btn = document.getElementById('scan-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Scanning...'; }

  const status = document.getElementById('scan-status');

  // Scan in batches of 3 to respect rate limits
  for (let i = 0; i < UNIVERSE.length; i += 2) {
    const batch = UNIVERSE.slice(i, i+2);
    if (status) status.textContent = `Scanning ${i+1}-${Math.min(i+2,UNIVERSE.length)} of ${UNIVERSE.length}... (${results.length} found)`;

    await Promise.all(batch.map(async stock => {
      try {
        const quote = await getQuote(stock.ticker);
        if (!quote || !quote.c || quote.c <= 0) return;
        const [candles, insider, recs] = await Promise.all([
          getCandles(stock.ticker),
          getInsider(stock.ticker),
          getRecommendations(stock.ticker),
        ]);

        const reversalSig  = scoreReversal(candles);
        const insiderSig   = scoreInsider(insider);
        const analystSig   = scoreAnalyst(recs);

        // Quant and options scores — seeded from known data, UW will replace
        // For now use reversal + analyst as proxy until UW connected
        const quantScore  = Math.min(100, reversalSig.score * 0.6 + analystSig.score * 0.4);
        const optionsScore = 0; // UW pending

        const titanScore = Math.round(
          quantScore   * (WEIGHTS.quant/100) +
          optionsScore * (WEIGHTS.options/100) +
          insiderSig.score * (WEIGHTS.insider/100) +
          analystSig.score * (WEIGHTS.analyst/100) +
          reversalSig.score * (WEIGHTS.reversal/100)
        );

        const signals = [];
        if (quantScore > 40)       signals.push({type:'quant',   label:'Quant' + (quantScore>70?'+':''), score:quantScore});
        if (insiderSig.score > 20) signals.push({type:'insider', label:'Insider x'+insiderSig.buyers, score:insiderSig.score});
        if (analystSig.score > 30) signals.push({type:'analyst', label:'Analyst', score:analystSig.score});
        if (reversalSig.score > 30)signals.push({type:'reversal',label:'Reversal', score:reversalSig.score});

        results.push({
          ...stock,
          titanScore,
          price: quote.c,
          change: quote.dp,
          changeDol: quote.d,
          signals,
          quantScore,
          optionsScore,
          insiderSig,
          analystSig,
          reversalSig,
          scannedAt: new Date().toISOString(),
        });
      } catch(e) { console.warn(stock.ticker, e.message); }
    }));

    // Rate limit pause
    if (i + 3 < UNIVERSE.length) await new Promise(r => setTimeout(r, 500));
  }

  results.sort((a,b) => b.titanScore - a.titanScore);
  lastScan = new Date();
  scanning = false;

  // Check for new alerts (score > 70)
  const newAlerts = results.filter(r => r.titanScore > 70 && !alerts.find(a => a.ticker===r.ticker));
  newAlerts.forEach(r => alerts.unshift({ticker:r.ticker, score:r.titanScore, date:new Date().toISOString()}));
  localStorage.setItem('titan_alerts', JSON.stringify(alerts.slice(0,50)));

  console.log('Scan complete, results:', results.length);
  filtered = [...results]; // show all by default
  activeFilter = 'all';
  renderScanner();
  toast(`Scan complete -- ${results.length} stocks analyzed`);
}

function applyFilter(filter) {
  activeFilter = filter;
  const search = document.getElementById('search-input')?.value?.toLowerCase()||'';
  filtered = results.filter(r => {
    const matchSearch = !search || r.ticker.toLowerCase().includes(search) || r.name.toLowerCase().includes(search);
    const matchFilter = filter==='all' || r.sector===filter ||
      (filter==='strong' && r.titanScore>=70) ||
      (filter==='watchlist' && watchlist.includes(r.ticker));
    return matchSearch && matchFilter;
  });
}

function scoreColor(s) {
  if (s >= 75) return '#4ADE80';
  if (s >= 55) return '#FBBF24';
  if (s >= 35) return '#F97316';
  return '#64748B';
}

async function generateAINarrative(r) {
  const prompt = `You are Titan, an early-signal stock intelligence engine. Analyze this stock briefly.

Stock: ${r.ticker} (${r.name}) - ${r.sector}
Titan Score: ${r.titanScore}/100
Price: $${r.price} (${r.change>=0?'+':''}${r.change?.toFixed(2)}% today)
Position in 52-week range: ${r.reversalSig?.posInRange}%
Insider buyers (90d): ${r.insiderSig?.buyers}
Analyst consensus score: ${r.analystSig?.score}
Signals firing: ${r.signals.map(s=>s.label).join(', ')||'None'}

In 3-4 sentences: Why might this stock be ready to move in the next 4-12 weeks? What is the key risk? What would confirm the thesis?
Be direct and specific. No disclaimers.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const d = await res.json();
    const text = d.content?.find(b => b.type==='text')?.text || 'Unable to generate analysis.';
    document.getElementById('ai-loading').style.display = 'none';
    const aiText = document.getElementById('ai-text');
    if (aiText) { aiText.style.display='block'; aiText.textContent=text; }
  } catch(e) {
    document.getElementById('ai-loading').style.display = 'none';
    const aiText = document.getElementById('ai-text');
    if (aiText) { aiText.style.display='block'; aiText.textContent='Error generating analysis. Check API key.'; }
  }
}

            <div style="font-size:11px;color:#64748B;margin-top:4px">$100/month — powers options flow signal (highest alpha signal)</div>
          </div>
        </div>
        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;padding:24px">
          <div style="font-size:12px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px">Signal Weights</div>
          ${Object.entries(WEIGHTS).map(([k,v])=>`
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <span style="font-size:13px;color:#64748B;text-transform:capitalize">${k}</span>
              <span style="font-size:15px;font-weight:700;color:#0F172A">${v}%</span>
            </div>`).join('')}
          <div style="font-size:11px;color:#64748B;margin-top:8px">Weights are fixed in v0.1 — customizable in v0.2</div>
        </div>
      </div>`;
    return;
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function() {
  const fk = getKey('finnhub');
  if (fk) document.getElementById('finnhub-key').value = fk;
  const uk = getKey('uw');
  if (uk) document.getElementById('uw-key').value = uk;
  renderScanner();
})();
</script>
</body>
</html>
